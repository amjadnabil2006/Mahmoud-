<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="cm-teal-grad" x1="20" y1="20" x2="160" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B4B52" />
      <stop offset="50%" stop-color="#0E5E67" />
      <stop offset="100%" stop-color="#147B85" />
    </linearGradient>

    <linearGradient id="cm-mint-grad" x1="100" y1="40" x2="220" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#83D9BD" />
      <stop offset="60%" stop-color="#64C4A3" />
      <stop offset="100%" stop-color="#4AA888" />
    </linearGradient>

    <linearGradient id="cm-peach-grad" x1="180" y1="40" x2="270" y2="190" gradientUnits="userSpaceOnUse">
